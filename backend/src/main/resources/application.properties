spring.application.name=Dat_san_cau_long
server.port=8080

# ==========================================================
# CẤU HÌNH KẾT NỐI MYSQL
# ==========================================================
# >>> [CHẾ ĐỘ 1: CHẠY TRÊN VPS HOẶC CÓ MẬT KHẨU MYSQL] (Mặc định đang bật)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dat_san_cau_long?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# >>> [CHẾ ĐỘ 2: CHẠY LOCALHOST TRÊN MÁY TÍNH VỚI XAMPP (phpMyAdmin không có mật khẩu)]
# Khi bạn của bạn test ở local dùng XAMPP thì thêm dấu # vào 4 dòng của CHẾ ĐỘ 1 ở trên,
# và xóa dấu # ở 4 dòng dưới này:
# spring.datasource.url=jdbc:mysql://localhost:3306/dat_san_cau_long?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&characterEncoding=UTF-8
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=

# Cấu hình Hibernate JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.check-template-location=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JWT Configuration
# Đặt biến môi trường JWT_SECRET (chuỗi hex dài từ 64 ký tự) khi chạy thật; giá trị mặc định chỉ dùng để chạy local
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# ==========================================================
# CẤU HÌNH GỬI MAIL OTP (Gmail SMTP)
# ==========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:nghiahuynh4567@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ewchikuqycybpxol}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=7000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=7000

# ==========================================================
# CẤU HÌNH THANH TOÁN TỰ ĐỘNG SEPAY
# ==========================================================
# Nhập API Key từ SePay nếu muốn bật bảo mật Token (để trống nếu đang test):
app.sepay.api-key=
